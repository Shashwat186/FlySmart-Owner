# Local development logging. Activate with SPRING_PROFILES_ACTIVE=dev or --spring.profiles.active=dev.

# Application debug logs (session checks, generated IDs, insert results, ...).
logging.level.smart.fly=DEBUG

# Executed SQL statements, plus their bound parameter values.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
