spring.application.name=FlySmart
server.port=9197

# Spring Web MVC views configurations
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Database credentials are supplied through environment variables.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway stays off against the live database until V1__baseline.sql is verified against the production schema.
spring.flyway.enabled=false

# Quiet by default; run with the "dev" profile (application-dev.properties) for debug and SQL logs.
logging.level.smart.fly=INFO
